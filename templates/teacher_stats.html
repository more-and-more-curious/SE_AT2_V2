{% extends "layout.html" %}

{% block body %}

<div class="header-whitespace"></div>

<div class="actions-container">
    <form action="{{ url_for('logout') }}" method="get" style="display: inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
    </form>
</div>

<div class="sml-logout">
    <form action="{{ url_for('logout') }}" method="get" style="display: inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" aria-label="Logout"><svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                                <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                            </svg></button>
    </form>
</div>

<div class="teacher_nav">
    <h3 class="other_tab"><a href="{{ url_for('teacher_tasks') }}">Tasks</a></h3>
    <h3 class="other_tab"><a href="{{ url_for('teacher_main') }}">Students</a></h3>
    <h3 class="current_tab">Statistics</h3>
</div>

{% if tasks is string and sessions is string %}
<div class="unauthorised">
    <br> {{sessions}} <br> <br>
    {{tasks}}
</div>
{% else %}
    <div class="graphs">
        <div id="prac_mins"></div>
        <div id="idv_divis"></div>
    </div>
{% endif %}

<script src="https://www.gstatic.com/charts/loader.js"></script>

<script>
const js_array_a = {{ sessions | tojson | safe }};
const js_array_b = {{ tasks | tojson | safe }};

google.charts.load('current',{packages:['corechart']});
google.charts.setOnLoadCallback(drawChart);

window.addEventListener('resize', drawChart);

function drawChart() {

    const min_data = google.visualization.arrayToDataTable(js_array_a);
    const idv_data = google.visualization.arrayToDataTable(js_array_b);

    const min_options = {
    title: 'Total Practice Minutes per Student',
    colors: ['#6b8e23'],
    hAxis: {title: 'Minutes'},
    vAxis: {title: 'Student'}
    };

    const idv_options = {
        title: 'Complete/Incomplete Split per Task',
        isStacked: 'percent',
        chartArea: {width: '50%'},
        hAxis: {
            title: 'Task',
            format: 'percent'
        },
        vAxis: {title: 'Percentage'},
        colors: ['#6b8e23', '#e74c3c']
    };

  const min_chart = new google.visualization.BarChart(
      document.getElementById('prac_mins')
  );

  const idv_chart = new google.visualization.ColumnChart(
      document.getElementById('idv_divis')
  );

  min_chart.draw(min_data, min_options);
  idv_chart.draw(idv_data, idv_options);
}
</script>

<div class="header-whitespace"></div>

{% endblock %}
